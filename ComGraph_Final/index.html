<!DOCTYPE html>
<html>

<head>
    <title>UV</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <!-- โหลด GLTFLoader-->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- lil-gui -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,//มุมมอง (FOV) ยิ่งสูงยิ่งมองเห็นกว้าง
            window.innerWidth / window.innerHeight,//
            0.1,//ระยะมองเห็นขั้นต่ำ
            1000//ระยะมองเห็นสูงสุด
        );
        camera.position.set(-5.87, 0.97, 4.75);//ความสูงตามแนวแกน -5.87,0.97, 4.75
        camera.lookAt(0, 0, 0);//มองไปยังจุดศูนย์กลาง

        //OrbitControls → ให้ผู้ใช้ใช้เมาส์ลากเพื่อหมุนกล้องได้
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);//จุดที่กล้องจะมอง
        controls.enableDamping = true;//ทำให้การหมุนsmooth
        controls.enablePan = true//การลากกล้อง

        //Ambient Light
        const ambientLight = new THREE.AmbientLight(0x808080);
        scene.add(ambientLight);

        //Directional Light
        const directionalLight = new THREE.DirectionalLight(0xffeedd, 0.5);
        directionalLight.position.set(-5, 6, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // ✅ Load environment EXR
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        /**/
        const exrLoader = new THREE.EXRLoader();
        exrLoader.load(
            'https://chotika47.github.io/ComGraph_Final/qwantani_moon_noon_puresky_1k.exr',
            (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;//ทำให้วัตถุมีแสงสะท้อนจาก environment
                scene.background = envMap;//ตั้งเป็นฉากหลัง

                texture.dispose();
                pmremGenerator.dispose();
            },
            undefined,
            (err) => {
                console.error('EXR load error:', err);
            }
        );
        

        //--------สร้างvertext & fragment shader สำหรับไฟเตาแก๊ส-----------
        const uniforms = {
            uTime: { value: 0.0 },//ใช้ขยับ animation (ค่าเวลาที่เปลี่ยนทุกเฟรม)
            uHeight: { value: null } // จะถูกเซ็ตเมื่อ TextureLoader โหลดรูปเสร็จ: uniforms.uHeight.value = tex; ใช้เป็น "แผนที่ความสูง" 
        };

        const vert = `
            uniform sampler2D uHeight;
            uniform float uTime;
            varying float vH;
            varying vec2 vUv;

            void main(){
            vec3 pos = position;// vec3 จาก geometry
            vUv = uv;
            
            float h = texture2D(uHeight, uv ).r; //อ่านค่าสว่างจาก texture grayscale (0..1) ,ใช้ vec2 (uv) เป็นพิกัด texture
            h += sin(uTime*5.0 + + uv.x * 20.0 + uv.y * 10.0 ) * 0.05;// เพิ่มความสั่นเล็กน้อยแบบสุ่ม (ใช้ sin กับตำแหน่ง)
            pos.z += (h - 0.75) * 1.2;//ดันตำแหน่ง z ของ vertex ขึ้นลง

            vH = h;//ส่งค่า h ไป fragment shader เพื่อเอาไประบายสี                             
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const frag = `
            precision mediump float;
            varying float vH;

            void main(){
            vec3 deepPurple = vec3(0.0, 0.0, 0.2);
            vec3 purple     = vec3(0.1, 0.0, 0.4);
            vec3 orange     = vec3(0.9, 0.3, 0.0);
            vec3 yellow     = vec3(1.0, 0.8, 0.0);
            vec3 white      = vec3(1.0, 1.0, 0.5);

            // ไล่โทนด้วย smoothstep
            float t1 = smoothstep(0.0, 0.35, vH);
            float t2 = smoothstep(0.35, 0.6, vH);
            float t3 = smoothstep(0.6, 1.0, vH);

            vec3 color = mix(deepPurple, purple, t1);
            color = mix(color, orange, t2);
            color = mix(color, yellow, t3);
            color = mix(color, white, smoothstep(0.7, 1.0, vH));

            gl_FragColor = vec4(color, 1.0);
            }

        `;

        //โหลดภาพ grayscale (Height Map)
        new THREE.TextureLoader()
            .load('https://chotika47.github.io/ComGraph_Final/fire_heightMap.png',
                (tex) => {
                    uniforms.uHeight.value = tex;//Three.js จะผูก texture นี้ให้กับ slot ของ sampler2D ใน shader (binding ของ GPU)
                    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;//ทำให้ sampling เมื่อ UV เกิน 0..1 จะวนซ้ำ (สำคัญเมื่อเลื่อน UV)
                    const geo = new THREE.PlaneBufferGeometry(1, 1, 200, 200);
                    const mat = new THREE.ShaderMaterial({
                        vertexShader: vert,
                        fragmentShader: frag,
                        uniforms: uniforms,
                        //wireframe: true, // เปิดถ้าอยากดูเส้นตาราง
                        side: THREE.DoubleSide

                    });

                    const mesh = new THREE.Mesh(geo, mat);
                    scene.add(mesh);
                    mesh.position.set(7.85, 0.18, 4.2);   // ขยับคลื่นไปข้างหลังนิดนึง
                    mesh.rotation.x = -Math.PI / 2; // หมุนให้เป็นแนวนอน (เหมือนพื้นน้ำ)
                    mesh.scale.set(0.95, 0.95, 1);       // ขยายขนาดคลื่น
                });


        (function loop() {
            uniforms.uTime.value += 0.05;
            requestAnimationFrame(loop);
        })();

        
        // --- โหลดไฟล์ .glb ---
        const loader = new THREE.GLTFLoader();
        const mixers = [];

        function loadGBL(glbLink) {
            return new Promise((resolve, reject) => {
                loader.load(
                    glbLink,
                    (gltf) => {
                        const model = gltf.scene;
                        scene.add(model);

                        // ถ้ามี animation
                        if (gltf.animations && gltf.animations.length > 0) {
                            const mixer = new THREE.AnimationMixer(model);
                            mixers.push(mixer);

                            const clip = gltf.animations.find(a => a.name === "Action" || a.name === "Take 001");
                            if (clip) {
                                const action = mixer.clipAction(clip);
                                action.loop = THREE.LoopRepeat;
                                action.clampWhenFinished = false;
                                action.play();
                            }
                        }

                        resolve(model);
                    },
                    undefined,
                    reject
                );
            });
        }

        
        
        /*------------------------------------------------------------------------*/
        const tree_leaves_uniforms = {
            uTime: { value: 0.0 },
            uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
            uTex: { value: new THREE.TextureLoader().load('https://thumbs.dreamstime.com/b/green-leaves-texture-24901818.jpg') }
        };

        const tree_leaves_vert = `
            uniform float uTime;
            varying vec3 vNormal;
            varying vec3 vPosW;
            varying vec2 vUv;

            void main(){
                vNormal = normalize(mat3(modelMatrix) * normal);
                vec3 pos = position;
                vUv = uv;
                vPosW = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const tree_leaves_frag = `
            precision mediump float;
            uniform vec3 uLightDir;
            varying vec3 vNormal;
            varying vec3 vPosW;
            varying vec2 vUv;
            uniform sampler2D uTex;

            void main(){
                float diffuse = clamp(dot(vNormal, uLightDir), 0.0, 1.0);
                float levels = 3.0;
                diffuse = floor(diffuse * levels) / levels;
                diffuse += 0.5;

                vec3 R = reflect(-uLightDir, vNormal);
                vec3 V = normalize(cameraPosition - vPosW);
                float specular = max(pow(dot(R,V), 16.0), 0.0);

                specular = step(0.5, specular);
                specular = smoothstep(0.4, 0.6, specular);
                specular = clamp(0.4, 0.6, specular);
                if(diffuse <= 0.3)
                    specular = 0.0;

                vec3 base = texture2D(uTex, vUv).rgb;
                vec3 color = (base * diffuse) + vec3(specular);

                gl_FragColor = vec4(color, 1.0);
            }
            `;

        const mat = new THREE.ShaderMaterial({
            vertexShader: tree_leaves_vert,
            fragmentShader: tree_leaves_frag,
            uniforms: tree_leaves_uniforms,
            side: THREE.DoubleSide
        });

        // โหลดโมเดลแล้วใช้ shader
        
        loader.load('https://chotika47.github.io/ComGraph_Final/tree_leaves.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material = mat;
                }
            });
            scene.add(model);
        });

        /*------------------------------------------------------------------------*/
        let isTransitioning = false;
        let transitionTarget = null;

        //กำหนดการคลิกเปลี่ยนมุมกล้อง
        const clickable = [];
        // เริ่มต้น cameraPosition และ targetPosition ด้วยค่ากล้องปัจจุบัน
        let cameraPosition ;//ตำแหน่งกล้อง
        let targetPosition ;//มุมกล้อง

        function addObj(mesh, name) {
            mesh.name = name;
            clickable.push(mesh);
            return mesh;
        }

        // ✅ ประกาศ VIEWS ว่าง ๆ ไว้ก่อน
        const VIEWS = {};

        //รอโหลดโมเดลให้เสร็จก่อนถึงจะคลิกได้
        (async function init() {
             // ✅ ใช้ await
            const aboutMe = await loadGBL('https://chotika47.github.io/ComGraph_Final/sign_aboutMe.glb');
            const works = await loadGBL('https://chotika47.github.io/ComGraph_Final/sign_work.glb');
            const credits = await loadGBL('https://chotika47.github.io/ComGraph_Final/sign_credit.glb');
            
            const sign2 = await loadGBL('https://chotika47.github.io/ComGraph_Final/sign2_next.glb');
            const sign3 = await loadGBL('https://chotika47.github.io/ComGraph_Final/sign3_back.glb');

            const back = await loadGBL('https://chotika47.github.io/ComGraph_Final/board_back.glb');
            back.position.set(-0.85, -0.8, 0.85);

            const next = await loadGBL('https://chotika47.github.io/ComGraph_Final/board_next.glb');
            next.position.set(0.4, -0.8, -0.3);

            // ✅ ตั้งค่า VIEWS หลังจากโมเดลโหลดเสร็จแล้ว
            VIEWS.aboutMe = {
                pos: new THREE.Vector3(-1.49, 1.46, -0.28), // 📸 ตำแหน่งกล้องใหม่
                tar: new THREE.Vector3(-20, 0, -20)
            };
            VIEWS.works = {
                pos: new THREE.Vector3(4.96, 1.54, 6.72),
                tar: new THREE.Vector3(4.96, 0.5, 0)
            };
            VIEWS.credits = {
                pos: new THREE.Vector3(5.87, 0.44, 5.38),
                tar: new THREE.Vector3(-60, 2, 0)
            };
            
            VIEWS.board_back = {
                pos: new THREE.Vector3(-5.87, 0.97, 4.75),
                tar: new THREE.Vector3(3, 0,0)
            };
            VIEWS.board_next= {
                pos: new THREE.Vector3(4.96, 1.54, 6.72),
                tar: new THREE.Vector3(4.96, 0.5, 0)
            };

            VIEWS.sign2_next = {
                pos: new THREE.Vector3(-3.59, 3.53, -0.54),//-3.59, 3.53, -0.54
                tar: new THREE.Vector3(0, 2, -30)
            };
            VIEWS.sign3_back = {
                pos: new THREE.Vector3(-5.87, 0.97, 4.75),
                tar: new THREE.Vector3(-5.87, 0, -20)
            };


            // ✅ ทำให้คลิกได้หลังโหลดเสร็จจริง ๆ
            addObj(aboutMe, 'aboutMe');
            addObj(works, 'works');
            addObj(credits, 'credits');
            addObj(back, 'board_back');
            addObj(next, 'board_next');
            addObj(sign2, 'sign2_next');
            addObj(sign3, 'sign3_back');
        })();

        loadGBL('https://chotika47.github.io/ComGraph_Final/ground.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/pinetree.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/tree_body.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/cooking_stove.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/fence.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/windmill.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/mushroomHouse.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/grass.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/mailbox.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/rockpath.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/rocks.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/small_mushrooms.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/wagon.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/wand.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/windmill.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/fishPond.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/mushroom1.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/mushroom2.glb').then(mushroom2 => {
            mushroom2.position.x = -9.5;  // 👈 ลองเลื่อนไปทางซ้าย (ค่าลบคือซ้าย, ค่าบวกคือขวา)
        });
        loadGBL('https://chotika47.github.io/ComGraph_Final/mushroom3.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/dinningArea.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/my_profile.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/lightPole.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/board.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/credit.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/sign2_pole.glb');
        loadGBL('https://chotika47.github.io/ComGraph_Final/sign3_pole.glb');

        // --- Raycaster + คลิกเพื่อสลับมุม ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function setPointer(e) {
            const r = renderer.domElement.getBoundingClientRect();
            const x = (e.clientX ?? e.touches[0].clientX) - r.left;
            const y = (e.clientY ?? e.touches[0].clientY) - r.top;
            pointer.x = (x / r.width) * 2 - 1;
            pointer.y = -(y / r.height) * 2 + 1;
        }

        function onPick(e) {
            setPointer(e);
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(clickable, true); // ✅ เปลี่ยนเป็น true เพื่อเช็ค children
            if (hits.length === 0) return;

            // ✅ หา parent object ที่อยู่ใน clickable
            let targetObj = null;
            for (let hit of hits) {
                let obj = hit.object;
                while (obj) {
                    if (clickable.includes(obj)) {
                        targetObj = obj;
                        break;
                    }
                    obj = obj.parent;
                }
                if (targetObj) break;
            }

            if (!targetObj) return;
            const view = VIEWS[targetObj.name];
            if (!view) return;

            // เริ่ม transition
            transitionTarget = {
                pos: view.pos.clone(),
                tar: view.tar.clone(),
                progress: 0
            };
            isTransitioning = true;
        }

        renderer.domElement.addEventListener('click', onPick);
        renderer.domElement.addEventListener('touchend', (e) => { onPick(e); }, { passive: true });

        // --- Resize ---
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        const clock = new THREE.Clock();
        function animate() {
            
            const delta = clock.getDelta();
            mixers.forEach(m => m.update(delta));// อัปเดต animation ของโมเดล

            tree_leaves_uniforms.uTime.value = performance.now() / 1000; // ปรับความเร็วได้ด้วยการคูณ factor
            tree_leaves_uniforms.uLightDir.value.set(
                //0.4,
                Math.sin(tree_leaves_uniforms.uTime.value) * 2.0,
                1.0,
                0.8
            ).normalize();

            if (isTransitioning && transitionTarget) {
                // ค่อย ๆ lerp กล้องและ target
                camera.position.lerp(transitionTarget.pos, 0.05);
                controls.target.lerp(transitionTarget.tar, 0.05);

                // ถ้าใกล้เป้าหมายแล้วให้หยุด transition
                if (camera.position.distanceTo(transitionTarget.pos) < 0.01 &&
                    controls.target.distanceTo(transitionTarget.tar) < 0.01) {
                    camera.position.copy(transitionTarget.pos);
                    controls.target.copy(transitionTarget.tar);
                    // หยุด transition เมื่อถึงจุดหมาย เพื่อให้ OrbitControls ทำงานปกติ
                    isTransitioning = false; // ✅ ปิด transition
                    transitionTarget = null;
                }
            }
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // 🔍 DEBUG CAMERA POSITION (กดปุ่ม "C" เพื่อดูค่ากล้องใน console)
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'c') {
                console.log('📸 Camera position:', camera.position);
                console.log('🎯 Controls target:', controls.target);
            }
        });
    </script>
</body>

</html>
